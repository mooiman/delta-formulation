Logging = "None"  # "iterations", "matrix", "pattern"

[Boundary]  # west, east
    treg = 30.0                                  # Regularization time on boundary
    eps_bc_corr = 0.0001
    bc_signals = ["periodic", "periodic"]          # Type "constant", "sine" 
    bc_type = ["dirichlet", "dirichlet"]          # Type "dirichlet", "borsboom" 
    bc_vals = [0.0, 0.0]                          # The inflow discharge

[Domain]
    Lx = 1.0        # Domain length [m]
    x_begin = -0.5  # Origin of the x-coordinate [m]

[Initial]
    ini_vals = [0.0]  # initial constituent [-]
    ini_vars = ["nwave"] # "constant", "envelope", "envelope_phi"

[Numerics]
    dt = 0.001                                    # Time step size [s], if dt == 0: then stationary problem
    dx = 0.01                                     # Grid size [m]
    c_psi = 4.0                                  
    theta = 0.5                                  # Implicitness factor (0.5 <= theta <= 1.0)
    iter_max = 50                               # Maximum number of nonlinear iterations
    eps_newton = 1.0e-12
    eps_bicgstab = 1.0e-12
    regularization_init = true
    regularization_iter = false
    regularization_time = true

[Output]
    dt_his = 0.01   # [s]
    dt_map = 0.1   # [s] 
    dt_screen = 0.1   # [s] 

[Physics]
    do_convection = true
    do_viscosity  = true
    viscosity     = 0.0001
    do_source     = false
    src_type      = "none"


[Time]
    tunit  = "s"  # "s", "m", "h", "d"
    tstart = 0.0
    tstop  = 5.0
