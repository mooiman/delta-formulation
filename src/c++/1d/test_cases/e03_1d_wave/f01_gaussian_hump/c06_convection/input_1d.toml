Logging = "None"  # "iterations", "matrix", "pattern"

[Boundary]
    treg        = 600.0  # Regularization time boundary signal
    eps_bc_corr = 0.01
    bc_signals  = ["constant", "constant"]  # Incoming signal  "q" or "zeta"
    bc_type     = ["borsboom", "borsboom"]  # Type "free_slip", "no_slip", "borsboom", "mooiman"  
    bc_vals     = [0.05, 0.005]
    bc_vars     = ["q", "zeta"]

[Domain]
    Lx            = 18000.0
    x_begin       = -9000.0                            # Begin coordinate of the domain
    depth         = 10.0
    geometry_type = "UniformGeometry"

[Initial]
    gauss_mu    = 4500.0
    gauss_sigma = 700.0
    gauss_amp   = 0.2
    ini_vars = ["zeta_gauss_hump", "u_constant"]
    ini_vals = [0.0, 0.0] # Initial values for "q" or "zeta"

[Numerics]
    dt                  = 10.0
    dx                  = 20.0
    c_psi               = 4.0
    theta               = 0.5
    iter_max            = 25
    eps_newton          = 1e-12
    eps_bicgstab        = 1e-12
    eps_abs_function    = 0.01
    regularization_init = false
    regularization_iter = false
    regularization_time = false

[Output]
    dt_his    = 10.0
    dt_map    = 1200.0
    dt_screen = 900.0

[Physics]
    g                   = 10.0
    do_q_equation       = true
    do_convection       = true
    do_bed_shear_stress = false
    do_viscosity        = false
    chezy_coefficient   = 50.0
    viscosity           = 0.0

[Time]
    tunit  = "h"  # "s", "m", "h", "d"
    tstart = 0.0
    tstop  = 8.0
