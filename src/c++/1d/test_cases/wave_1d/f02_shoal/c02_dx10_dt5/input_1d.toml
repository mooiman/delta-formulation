Logging = "None"  # "iterations", "matrix", "pattern", "none"

[Boundary]
    treg = 600.0                                 # Regularization time on boundary
    eps_bc_corr = 1.0e-5
    bc_signals  = ["constant", "constant"]  # Incoming signal  "q" or "zeta"
    bc_type = ["borsboom", "borsboom"]              # Type "mooiman", "borsboom"
    bc_vals = [0.0, 0.0]                          # The inflow discharge
    bc_vars = ["q", "zeta"]                       # Incoming signal "q" or "zeta"  

[Domain]
    Lx = 12000.0                                  # Domain length [m]
    x_begin       = -6000.0                            # Begin coordinate of the domain
    depth = 10.0    # bathymetry below reference level [m]
    geometry_type = "Shoal"

        
[Initial]
    gauss_mu = 0.0    # location of the top of the gaussian hump
    gauss_sigma = 350.0    # width of the gaussian hump
    gauss_amp = 0.02 # twice the amplitude of the gaussian hump at the boundary
    ini_vars = ["zeta_gauss_hump", "u_constant"]
    ini_vals = [0.0, 0.0]

[Physics]
    g = 10.0                                      # Gravitational acceleration
    do_convection = false                   # Include momentum convection term

[Numerics]
    dt = 5.0                                      # Time step size [s], if dt == 0: then stationary problem
    dx = 10.0                                     # Grid size [m]
    iter_max = 25                                 # Maximum number of nonlinear iterations
    theta = 0.5                                   # Implicitness factor (0.5 <= theta <= 1.0)
    eps_newton = 1.0e-12
    eps_bicgstab = 1.0e-12

[Output]
    dt_his = 5.0   # [s]
    dt_map = 15.0  # [s] 
    dt_screen = 900.0

[Time]
    tunit  = "h"  # "s", "m", "h", "d"
    tstart = 0.0
    tstop  = 3.0
