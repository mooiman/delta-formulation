Logging = "None"  # "iterations", "matrix", "pattern"

[Boundary]  # north, east, south, west
    treg = 1800.0                                  # Regularization time boundary signal
    eps_bc_corr = 1.0e-2
    bc_signals   = ["constant", "constant", "constant", "constant"]
    bc_type = ["free_slip", "borsboom", "free_slip", "borsboom"] # Type "borsboom", "no_slip", "free_slip", "mooiman" 
    bc_vars = ["r", "zeta", "r", "q"]  # "zeta", "q", "r"
    bc_vals = [0.0, 0.0, 0.0, 1.0]

[Domain]
    mesh_file = "geometry/160mx080m_111x6_net.nc"
    bed_level_file = "geometry/160mx080m_111x6_flat1.dep"
    
[Initial]
    ini_vals      = [0.0, 0.0, 0.0]
    ini_vars      = ["zeta_constant", "u_constant", "v_constant"]
    gauss_amp = 0.0 # amplitude of the gaussian hump
    gauss_mu = 0.0    # location of the top of the gaussian hump
    gauss_sigma = 350.0    # width of the gaussian hump



[Numerics]
    dt = 30.0                                     # Time step size [s], if dt == 0: then stationary problem
    theta = 0.5                                   # Implicitness factor (0.5 <= theta <= 1.0)
    c_psi               = 4.0
    iter_max            = 25  # Maximum number of non-linear iterations
    eps_newton          = 1e-12
    eps_bicgstab        = 1e-12
    eps_abs_function    = 0.01
    linear_solver       = "bicgstab"  # "bicgstab", "multigrid"
    regularization_init = true
    regularization_iter = false
    regularization_time = false

[Output]
    dt_his    = 0.01
    dt_map    = 300.0
    dt_screen = 300.0

[Physics]
    g = 10.0                                      # Gravitational acceleration
    do_linear_waves     = true
    do_continuity       = true
    do_q_equation       = true
    do_r_equation       = true
    do_convection       = true
    do_bed_shear_stress = true
    do_viscosity        = true
    chezy_coefficient   = 50.0
    viscosity           = 500.0

[Time]
    tunit = "h" # "m" # "h" # "d"
    tstart = 0.0
    tstop  = 6.0
