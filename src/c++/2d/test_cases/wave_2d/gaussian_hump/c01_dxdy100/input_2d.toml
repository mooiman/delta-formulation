Logging = "none"  # "iterations", "matrix", "pattern", "none"

[Boundary] # north, east, south, west
    bc_signals = ["constant", "constant", "constant", "constant"]
    bc_type = ["borsboom", "borsboom", "borsboom", "borsboom"] # Type "borsboom", "free_slip", "mooiman" 
    bc_vars = ["zeta", "zeta", "zeta", "zeta"]
    bc_vals = [0.0, 0.0, 0.0, 0.0]
    treg = 150.0                                  # Regularization time boundary signal
    eps_bc_corr = 1.0e-02

[Domain]
    mesh_file = "geometry/62x62_6x6km_net.nc"
    bed_level_file = "geometry/62x62_6x6km_flat.dep"
        
[Initial]
    ini_vars = ["zeta_gauss_hump", "u_constant", "v_constant"]
    ini_vals = [0.0, 0.0, 0.0]
    gauss_amp = 1.0 # amplitude of the gaussian hump
    gauss_mu = 0.0    # location of the top of the gaussian hump
    gauss_sigma = 350.0    # width of the gaussian hump

[Numerics]
    dt = 15.0                       # Time step size [s], if dt == 0: then stationary problem
    iter_max = 25                   # Maximum number of nonlinear iterations
    theta = 0.5                     # Implicitness factor (0.5 <= theta <= 1.0)
    c_psi = 4.0
    regularization_init = true
    regularization_iter = false
    regularization_time = true
    eps_newton = 1.0e-12
    eps_bicgstab = 1.0e-12
    linear_solver = "bicgstab"

[Output]
    dt_his = 0.01   # [s]
    dt_map = 30.0   # [s]
    dt_screen = 120.0

[Physics]
    g = 10.0                        # Gravitational acceleration
    do_continuity = true            # continuity equation
    do_q_equation = true            # q momentum equation
    do_r_equation = true            # r momentum equation
    do_convection = false           # Include momentum convection term
    do_viscosity = false            # Include momentum viscosity term
    do_bed_shear_stress = false     # Include momentum bed shear stress term
    viscosity = 0.01
    chezy_coefficient = 50.0        # Chezy coefficient

[Time]
    tunit = "s"
    tstart = 0.0                                  # Start time [s]
    tstop = 1800.0                                # End time [s]

[[ObservationPoint]]
    x = 2500.0
    y = 0.0
    name = "A"    
  
[[ObservationPoint]]
    x = 2000.0
    y = 1500.0
    name = "B"    

[[ObservationPoint]]
    x = 1500.0
    y = 2000.0
    name = "C"    

[[ObservationPoint]]
    x = 0.0
    y = 2500.0
    name = "D"    
